    var partnerWinning = owner === partnerOf(idx);

    if (partnerWinning) {
      /* 新手偶尔手痒；普通/高手一律让牌 */
      if (diff <= 0 && Math.random() < 0.25) {
        var cheap0 = cands.filter(function (c) { return !GD.bombFamily(c); });
        if (cheap0.length) return { action: 'play', cards: cheap0[0].cards.slice() };
      }
      return { action: 'pass' };
    }

    var nonBomb = cands.filter(function (c) { return !GD.bombFamily(c); });
    if (nonBomb.length) {
      if (diff <= 0 && Math.random() < 0.15) {
        return { action: 'play', cards: nonBomb[0].cards.slice() };
      }
      var plan = GD.decomposeHand(hand, level, 18);
      var best = scoredCandidates(nonBomb, hand, level, plan, useThreat ? mem : null)[0];

      /* 憋牌：为压一手小牌要拆掉已经成型的牌型（尤其实在动逢人配），
         而对手还早得很 —— 不如过，把结构留住 */
      if (useHoldBack && mem && diff >= 1 && best.broken >= 10 && hand.length > 10) {
        var cheapTrick = (cur.type !== 'bomb' && cur.type !== 'jokerbomb') &&
          cur.rank <= 10 && cur.cards.length <= 5;
        if (cheapTrick && minOpponentCards(deal, idx) > 8) return { action: 'pass' };
      }
      return { action: 'play', cards: best.combo.cards.slice() };
    }

    if (shouldBomb(deal, idx, diff, cur, mem, cands[0])) {
      return { action: 'play', cards: cands[0].cards.slice() };
    }
    return { action: 'pass' };
  }

  function aiTurn(match, idx, diff, opts) {
    var deal = match.deal;
    if (deal.phase !== 'play' || deal.turn !== idx) return { action: 'pass' };
    var o = (opts && typeof opts === 'object') ? opts : { legacy: !!opts };
    var mem = o.legacy ? null : buildMemory(deal, idx, deal.level);
    if (!deal.trick.combo) {
      return { action: 'play', cards: leadChoice(deal, idx, o.leadThreat === false ? null : mem) };
    }
    return followChoice(deal, idx, diff == null ? 1 : diff, mem, o);
  }

  /* ---------------------------------------------------------------- 教练提示 */

  function altsText(cands, deal, limit) {
    return cands.slice(0, limit || 3).map(function (c) {
      return GD.comboLabel(c, deal.level);
    });
  }

  function threatNote(combo, mem, level) {
    if (!combo || !mem) return '';
    var t = threatOf(combo, mem, level);
    if (t < 0.5) {
      return '<br><b>记牌</b>：外面已经没有能压过它的牌了（相关大牌都在你手上或已经出过），这手能直接<b>拿住牌权</b>。';
    }
    if (t < 1.6) {
      return '<br><b>记牌</b>：外面大约还有 <b>' + Math.max(1, Math.round(t)) + '</b> 手能压过它，不算稳。';
    }
    return '<br><b>记牌</b>：外面还有约 <b>' + Math.round(t) + '</b> 手能压过它，更偏"试探"。';
  }

  function hint(match, idx) {
    var deal = match.deal;
    var level = deal.level;
    var hand = deal.hands[idx];
    var cur = deal.trick.combo;

    if (deal.turn !== idx) return null;
    var mem = buildMemory(deal, idx, level);

    /* 领出 */
    if (!cur) {
      var whole = GD.identify(hand, level);
      var cards = leadChoice(deal, idx, mem);
      var combo = GD.identify(cards, level);
      var leadPlan = GD.decomposeHand(hand, level, 16);
      var nonBombs = leadPlan.hands.filter(function (h) { return h.type !== 'raw' && !GD.bombFamily(h); });
      return {
        action: 'play',
        cards: cards,
        combo: combo,
        reason: whole
          ? '你手上的牌<b>一把就能走完</b>，直接出，本副头游就是你的。'
          : '这圈由你<b>领出</b>。优先出最整的一手（顺子 / 钢板 / 三连对），把单张和大牌留到后面 —— 单张每出一张，就等于把牌权送出去一次。' +
            (nonBombs.length === 1 ? '现在只剩一种整手牌，出完就要靠单张了，更要先抢这一手。' : '') +
            threatNote(combo, mem, level),
        alts: altsText(nonBombs.sort(function (a, b) {
          return (LEAD_PRIORITY[a.type] || 5) - (LEAD_PRIORITY[b.type] || 5);
        }), deal)
      };
    }

    var cands = beats(hand, level, cur);
    var owner = deal.trick.owner;
    var partnerWinning = owner === partnerOf(idx);
    var ownerName = SEAT_NAME[owner];

    /* 能一把走完 */
    for (var i = 0; i < cands.length; i++) {
      if (cands[i].cards.length === hand.length) {
        return {
          action: 'play',
          cards: cands[i].cards.slice(),
          combo: cands[i],
          reason: '这一手出完你就<b>走完</b>了，别犹豫，直接出。',
          alts: altsText(cands, deal)
        };
      }
    }

    if (partnerWinning) {
      var partnerFinished = isFinished(deal, owner);
      return {
        action: 'pass',
        cards: [],
        reason: '这一圈最大的是<b>队友</b>（' + ownerName + '）的牌。' +
          (partnerFinished
            ? '队友<b>已经走完</b>，这一圈结束牌权会按接风规则传给队友的下家。若你这一手能<b>直接走完</b>，或想抢下牌权自己领出，可以压；否则就"过"。'
            : '<b>不要压队友</b> —— 压上去等于抢走队友的牌权，还白耗一手好牌。除非你这一手能直接走完，否则就"过"。'),
        alts: altsText(cands, deal)
      };
    }

    if (!cands.length) {
      return {
        action: 'pass',
        cards: [],
        reason: '你手上没有能压过 <b>' + GD.comboLabel(cur, level) + '</b> 的牌，安心过，把牌留着。',
        alts: []
      };
    }

    var nonBomb = cands.filter(function (c) { return !GD.bombFamily(c); });
    if (nonBomb.length) {
      var plan = GD.decomposeHand(hand, level, 16);
      var ranked = scoredCandidates(nonBomb, hand, level, plan, mem);
      var best = ranked[0];
      return {
        action: 'play',
        cards: best.combo.cards.slice(),
        combo: best.combo,
        reason: '这一圈是对手（' + ownerName + '）的牌，要压。选<b>代价最小</b>的那一手：' +
          GD.comboLabel(best.combo, level) + ' —— 刚刚压过，又尽量不拆自己已经成型的牌，炸弹一张不动。' +
          threatNote(best.combo, mem, level),
        alts: altsText(ranked.map(function (x) { return x.combo; }), deal)
      };
    }

    var oppLeft = [0, 1, 2, 3].filter(function (i) {
      return teamOf(i) !== teamOf(idx) && !isFinished(deal, i);
    }).map(function (i) { return deal.hands[i].length; });
    var minOpp = oppLeft.length ? Math.min.apply(null, oppLeft) : 0;
    var boom = shouldBomb(deal, idx, 1, cur, mem, cands[0]);
    return {
      action: boom ? 'play' : 'pass',
      cards: boom ? cands[0].cards.slice() : [],
      combo: boom ? cands[0] : null,
      reason: boom
        ? '同牌型已经压不住了，只剩炸弹。对手手上最少还有 <b>' + minOpp + ' 张</b>，这个时机值得炸。'
        : '同牌型压不住，只剩炸弹可用。但对手至少还有 <b>' + minOpp + ' 张</b>，现在炸性价比不高 —— 建议先过，把炸弹留到关键手。',
      alts: altsText(cands, deal)
    };
  }

  /* ------------------------------------------------------------------ 导出 */

  /** 二项分布尾概率：u 张未知牌里，某个具体玩家拿到 ≥k 张的概率 */
  function binomAtLeast(u, k, p) {
    if (u < k) return 0;
    var s = 0, c = 1;
    for (var i = 0; i <= u; i++) {
      if (i >= k) s += c * Math.pow(p, i) * Math.pow(1 - p, u - i);
      c = c * (u - i) / (i + 1);
    }
    return s;
  }

  /** 供界面使用的记牌视图：外面还剩哪些牌、还可能存在几个炸弹 */
  function memoryOf(match, idx) {
    var deal = match.deal;
    var mem = buildMemory(deal, idx, deal.level);

    /* 炸弹不能只看"外面还有 4 张"：这 4 张得落在同一个人手里。
       按每张未知牌 1/3 概率落到某个具体玩家，估"三家中有炸"的概率。 */
    var pBomb = {}, bombExpect = 0;
    for (var b = 2; b <= 14; b++) {
      var u = mem.cnt[b];
      var p1 = binomAtLeast(u, 4, 1 / 3);
      var pAny = 1 - Math.pow(1 - p1, 3);
      pBomb[b] = pAny;
      bombExpect += pAny;
    }

    var list = [];
    list.push({ kind: 'big', label: '大王', count: mem.jok[16] });
    list.push({ kind: 'small', label: '小王', count: mem.jok[15] });
    list.push({ kind: 'wild', label: '逢人配', count: mem.wilds });
    for (var r = 14; r >= 2; r--) {
      list.push({
        kind: 'rank', rank: r, label: GD.RANK_TEXT[r] + (r === deal.level ? '级' : ''),
        count: mem.cnt[r], isLevel: r === deal.level, pBomb: pBomb[r]
      });
    }

    var top = [];
    for (var t = 2; t <= 14; t++) if (pBomb[t] > 0.3) top.push(t);
    top.sort(function (x, y) { return pBomb[y] - pBomb[x]; });

    mem.list = list;
    mem.pBomb = pBomb;
    mem.bombExpect = bombExpect;
    mem.topBombRanks = top.slice(0, 3);
    return mem;
  }

  return {
    SEAT_NAME: SEAT_NAME,
    teamOf: teamOf,
    partnerOf: partnerOf,
    isFinished: isFinished,
    startMatch: startMatch,
    newDeal: newDeal,
    play: play,
    pass: pass,
    beats: beats,
    aiTurn: aiTurn,
    hint: hint,
    leadChoice: leadChoice,
    followChoice: followChoice,
    memoryOf: memoryOf,
    threatOf: threatOf
  };
});

(function (root) {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* 单张牌 */
  function card(c, level, o) {
    o = o || {};
    var cls = ['card'];
    var joker = c.s === 'X';
    var red = joker ? c.r === 16 : (c.s === 'H' || c.s === 'D');
    if (joker) cls.push('joker');
    if (red) cls.push('red');
    if (GD.isWild(c, level)) cls.push('wild');
    if (o.size) cls.push('size-' + o.size);
    if (o.dim) cls.push('dim');
    if (o.clickable) cls.push('clickable');
    if (o.cls) cls.push(o.cls);

    var face;
    if (joker) {
      face = '<span class="joker-text">' + (c.r === 16 ? '大王' : '小王') + '</span>';
    } else {
      face = '<span class="corner"><b>' + GD.RANK_TEXT[c.r] + '</b><i>' + GD.SUIT_TEXT[c.s] + '</i></span>' +
        '<span class="big">' + GD.SUIT_TEXT[c.s] + '</span>';
    }
    var badge = GD.isWild(c, level) ? '<span class="badge">配</span>' : '';
    var cardName = joker ? (c.r === 16 ? '大王' : '小王') : GD.SUIT_TEXT[c.s] + GD.RANK_TEXT[c.r];
    var a11y = o.clickable
      ? ' role="button" tabindex="0" aria-label="' + cardName + (GD.isWild(c, level) ? '，逢人配' : '') + '" aria-pressed="' + (o.cls && o.cls.indexOf('is-picked') >= 0 ? 'true' : 'false') + '"'
      : ' role="img" aria-label="' + cardName + (GD.isWild(c, level) ? '，逢人配' : '') + '"';

(function (root) {
  'use strict';
  var GD = root.GD, UI = root.UI;

  var ALL = ['single', 'pair', 'triple', 'fullhouse', 'tube', 'plate', 'straight', 'flush', 'bomb', 'jokerbomb'];
  /* 出题权重：把新手最容易混的牌型排前面 */
  var WEIGHTED = ['straight', 'flush', 'tube', 'plate', 'fullhouse', 'straight', 'flush',
    'tube', 'plate', 'fullhouse', 'bomb', 'triple', 'pair', 'jokerbomb', 'single'];

  var CONFUSE = {
    straight: ['flush', 'tube', 'plate', 'triple'],
    flush: ['straight', 'bomb', 'plate', 'fullhouse'],
    tube: ['plate', 'straight', 'triple', 'fullhouse'],
    plate: ['tube', 'straight', 'fullhouse', 'triple'],
    fullhouse: ['plate', 'triple', 'tube', 'straight'],
    triple: ['fullhouse', 'plate', 'pair', 'tube'],
    pair: ['triple', 'fullhouse', 'single', 'tube'],
    single: ['pair', 'triple', 'straight', 'bomb'],
    bomb: ['flush', 'jokerbomb', 'plate', 'fullhouse'],
    jokerbomb: ['bomb', 'flush', 'triple', 'plate']
  };

  var S = {
    level: 2, mode: 'identify', q: null, picked: null,
    right: 0, total: 0, streak: 0, best: 0
  };

  function pick(arr, rnd) { return arr[Math.floor(rnd() * arr.length)]; }

  function shuffleArr(a, rnd) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function withWild(cards, type, level, rnd) {
    if (rnd() > 0.40) return cards;
    var wild = GD.makeCard('H', level, 0);
    for (var i = 0; i < cards.length; i++) {
      var trial = cards.slice();
      trial[i] = wild;
      var id = GD.identify(trial, level);
      if (id && id.type === type) return trial;
    }
    return cards;
  }

  function rankTextOf(combo, level) {
    if (combo.type === 'jokerbomb') return '四大天王';
    if (combo.type === 'bomb') return combo.size + ' 张炸弹 ' + (combo.nat === level ? '级牌' : GD.RANK_TEXT[combo.nat]);
    if (combo.type === 'flush') return '最大牌 ' + GD.RANK_TEXT[combo.rank];
    if (combo.type === 'straight') return '最大牌 ' + GD.RANK_TEXT[combo.rank];
    if (combo.type === 'tube') return '最大对 ' + GD.RANK_TEXT[combo.rank];
    if (combo.type === 'plate') return '最大三张 ' + GD.RANK_TEXT[combo.rank];
    if (combo.type === 'fullhouse') return '三张是 ' + (combo.tripleRank === level ? '级牌' : GD.RANK_TEXT[combo.tripleRank]);
    return combo.nat === level ? '级牌' : GD.RANK_TEXT[combo.nat];
  }

  /* ---------------------------------------------------------- 出题：认牌型 */

  function makeIdentify(rnd) {
    var type = pick(WEIGHTED, rnd);
    var level = S.level;
    var cards = null, id = null;
    for (var i = 0; i < 40; i++) {
      var base = GD.sample(type, level, rnd);
      var trial = withWild(base, type, level, rnd);
      var got = GD.identify(trial, level);
      if (got && got.type === type) { cards = trial; id = got; break; }
      if (!cards && got) { cards = trial; id = got; type = got.type; }
    }
    if (!cards) return null;

    var opts = [type];
    var pool = shuffleArr((CONFUSE[type] || []).slice(), rnd);
    pool.forEach(function (t) { if (opts.length < 4 && opts.indexOf(t) < 0) opts.push(t); });
    shuffleArr(ALL, rnd).forEach(function (t) { if (opts.length < 4 && opts.indexOf(t) < 0) opts.push(t); });
    shuffleArr(opts, rnd);

    return { kind: 'identify', type: type, cards: cards, combo: id, options: opts };
  }

  /* ---------------------------------------------------------- 出题：比大小 */

  function makeCompare(rnd) {
    var level = S.level;
    var normalTypes = ['single', 'pair', 'triple', 'fullhouse', 'tube', 'plate', 'straight'];
    var kind = rnd() < 0.55 ? 'same' : (rnd() < 0.55 ? 'bomb' : 'none');

    var a, b, answer, explain;

    if (kind === 'same') {
      var t = pick(normalTypes.concat(['bomb', 'flush']), rnd);
      for (var i = 0; i < 40; i++) {
        a = GD.identify(GD.sample(t, level, rnd), level);
        b = GD.identify(GD.sample(t, level, rnd), level);
        if (a && b && a.type === b.type && a.rank !== b.rank) break;
      }
      if (!a || !b || a.type !== b.type || a.rank === b.rank) return makeCompare(rnd);
      var biggerIsA = a.rank > b.rank;
      answer = biggerIsA ? 'A' : 'B';
      explain = '两边都是<b>' + GD.TYPE_NAME[a.type] + '</b>，同牌型比大小：' +
        '<b>' + rankTextOf(a, level) + '</b> vs <b>' + rankTextOf(b, level) + '</b>，' +
        '所以' + (biggerIsA ? '左边' : '右边') + '更大。';
    } else if (kind === 'bomb') {
      var nt = pick(normalTypes, rnd);
      var bm = pick(['bomb', 'flush', 'bomb'], rnd);
      a = GD.identify(GD.sample(nt, level, rnd), level);
      b = GD.identify(GD.sample(bm, level, rnd), level);
      if (!a || !b) return makeCompare(rnd);
      if (rnd() < 0.5) { var tmp = a; a = b; b = tmp; }
      answer = GD.bombFamily(a) ? 'A' : 'B';
      var bombSide = answer === 'A' ? '左边' : '右边';
      var bombCombo = answer === 'A' ? a : b;
      explain = bombSide + '的<b>' + GD.comboLabel(bombCombo, level) + '</b>属于炸弹家族，' +
        '可以压任何普通牌型 —— 普通牌型再大也压不过炸弹。';
    } else {
      var t1 = pick(normalTypes, rnd);
      var t2 = pick(normalTypes.filter(function (x) { return x !== t1; }), rnd);
      a = GD.identify(GD.sample(t1, level, rnd), level);
      b = GD.identify(GD.sample(t2, level, rnd), level);
      if (!a || !b || a.type === b.type) return makeCompare(rnd);
      answer = 'none';
      explain = '<b>' + GD.TYPE_NAME[a.type] + '</b> 和 <b>' + GD.TYPE_NAME[b.type] + '</b> 不是同一种牌型，' +
        '普通牌型之间不能互相压 —— 只有炸弹家族才能跨牌型出牌。';
    }

    return { kind: 'compare', a: a, b: b, answer: answer, explain: explain };
  }

  /* ---------------------------------------------------------------- 渲染 */

  function headHTML() {
    return '<div class="sec-head">' +
      '<h2>牌型判定</h2><p>练到看一眼就认出来</p>' +
      '<div class="spacer"></div>' +
      '<div class="mode-switch">' +
      '<button data-mode="identify" class="' + (S.mode === 'identify' ? 'is-active' : '') + '">认牌型</button>' +
      '<button data-mode="compare" class="' + (S.mode === 'compare' ? 'is-active' : '') + '">比大小</button>' +
      '</div>' +
      '</div>';
  }

  function statsHTML() {
    var rate = S.total ? Math.round(S.right / S.total * 100) : 0;
    return '<div class="quiz-bar">' +
      '<div class="stat">答对<b>' + S.right + '</b>/' + S.total + '</div>' +
      '<div class="stat">正确率<b>' + rate + '%</b></div>' +
      '<div class="stat">连对<b>' + S.streak + '</b></div>' +
      '<div class="spacer" style="flex:1"></div>' +
      '<button class="btn btn-sm ghost" data-act="reset">重新开始</button>' +
      '</div>';
  }

  function identifyHTML() {
    var q = S.q;
    var done = S.picked !== null;
    var opts = q.options.map(function (t) {
      var cls = 'opt';
      if (done) {
        if (t === q.type) cls += ' correct';
        else if (t === S.picked) cls += ' wrong';
      }
      return '<button class="' + cls + '" data-opt="' + t + '" ' + (done ? 'disabled' : '') + '>' +
        GD.TYPE_NAME[t] + '</button>';

    var fb = '<div class="feedback">出好了就先自己判断，选完再看解释。</div>';
    if (done) {
      var ok = S.picked === q.type;
      var w = GD.wildAssignments(q.combo, S.level);
      fb = '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' +
        (ok ? '✅ 答对了。' : '❌ 正确答案是 <b>' + GD.TYPE_NAME[q.type] + '</b>。') +
        '<br>这手是 <b>' + GD.comboLabel(q.combo, S.level) + '</b>。' + GD.TYPE_HINT[q.type] +
        (w.length ? '<br>其中 <b>逢人配</b> 被当作：' + w.map(function (x) {
          return GD.cardText(x.card) + ' → ' + x.as;
        }).join('、') + '。' : '') +
        '</div>';
    }

    return '<div class="quiz-stage">' +
      '<div class="quiz-q">第 ' + (S.total + (S.picked === null ? 1 : 0)) + ' 题 · 这手牌是什么牌型？</div>' +
      UI.row(q.cards, S.level, { size: 'lg' }) +
      '</div>' +
      '<div class="quiz-options four" style="margin-top:14px">' + opts + '</div>' +
      '<div style="margin-top:14px">' + fb + '</div>' +
      '<div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px">' +
      (done ? '<button class="btn primary" data-act="next">下一题 →</button>' : '') +
      '</div>';
  }

  function compareHTML() {
    var q = S.q;
    var done = S.picked !== null;
    var labels = [['A', q.a], ['B', q.b]];
    var opts = ['A', 'B', 'none'].map(function (v) {
      var text = v === 'A' ? '左边大' : v === 'B' ? '右边大' : '不能比较';
      var cls = 'opt';
      if (done) {
        if (v === q.answer) cls += ' correct';

      }
      return '<button class="' + cls + '" data-opt="' + v + '" ' + (done ? 'disabled' : '') + '>' + text + '</button>';
    }).join('');

    var side = function (label, combo) {
      return '<div style="text-align:center">' +
        '<div class="quiz-q" style="margin-bottom:10px">' + label + '</div>' +
        UI.row(combo.cards, S.level, { size: 'lg' }) +
        '</div>';
    };

    var fb = '<div class="feedback">两边谁的牌更大？如果根本不能比，就选"不能比较"。</div>';
    if (done) {
      var ok = S.picked === q.answer;
      fb = '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' +
        (ok ? '✅ 答对了。' : '❌ 答错了。') + '<br>' + q.explain +
        '</div>';
    }

    return '<div class="quiz-stage">' +
      '<div class="quiz-q">第 ' + (S.total + (S.picked === null ? 1 : 0)) + ' 题 · 谁能压过谁？</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;width:100%;align-items:start">' +
      side('A', q.a) + side('B', q.b) +
      '</div>' +
      '</div>' +
      '<div class="quiz-options" style="margin-top:14px">' + opts + '</div>' +
      '<div style="margin-top:14px">' + fb + '</div>' +
      '<div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px">' +
      (done ? '<button class="btn primary" data-act="next">下一题 →</button>' : '') +
      '</div>';
  }

  function bodyHTML() {
    if (!S.q) return '<div class="empty-state">出题失败，点"重新开始"再试一次。</div>';
    return S.mode === 'identify' ? identifyHTML() : compareHTML();
  }

  function paint(el) {
    el.innerHTML = '<section class="panel">' + headHTML() + statsHTML() + bodyHTML() + '</section>';

(function (root) {

  function sameCount(s, r) {

  }

  function add(s, r) {
    if (sameCount(s, r) >= 2) return;
    if (S.sel.length >= 12) return;
    S.sel.push(GD.makeCard(s, r, sameCount(s, r)));
  }

  function removeAt(i) {
    if (i >= 0 && i < S.sel.length) S.sel.splice(i, 1);

  function deckHTML(level) {
    var html = '<div class="deck-picker">';
    for (var r = 2; r <= 14; r++) {
      var isLevel = r === level;
      html += '<div class="deck-row">' +
        '<div class="deck-rank' + (isLevel ? ' is-level' : '') + '">' + GD.RANK_TEXT[r] + '</div>';
      GD.SUITS.forEach(function (s) {
        var wild = s === 'H' && isLevel;
        var red = s === 'H' || s === 'D';
        html += '<button class="suit-btn' + (red ? ' red' : '') + (wild ? ' wild' : '') +
          '" data-suit="' + s + '" data-rank="' + r + '" title="' +
          GD.SUIT_NAME[s] + GD.RANK_TEXT[r] + (wild ? '（逢人配）' : '') + '">' +
          GD.SUIT_TEXT[s] + '</button>';
      });
      html += '<div></div></div>';
    }
    html += '<div class="deck-row">' +
      '<div class="deck-rank">王</div>' +
      '<button class="joker-btn" data-suit="X" data-rank="15" style="grid-column:span 2">小王</button>' +
      '<button class="joker-btn" data-suit="X" data-rank="16" style="grid-column:span 2">大王</button>' +
      '<div></div></div>';
    html += '</div>';
    return html;
  }

  function resultsHTML(level) {
    if (!S.sel.length) {
      return '<div class="empty-state">从左边点牌放进托盘，这里会实时告诉你<br>' +
        '这手牌能组成哪些牌型、逢人配被当成了什么。</div>';
    }
    var ints = GD.interpretations(S.sel, level);
    if (!ints.length) {
      return '<div class="empty-state">这 ' + S.sel.length + ' 张牌<b style="color:#f0a79f">凑不出任何合法牌型</b>。<br>' +
        '掼蛋里合法牌型只有：单张 / 对子 / 三同张 / 三带二 / 三连对 / 钢板 / 顺子 / 同花顺 / 炸弹 / 四大天王。<br>' +
        '可以试试加一张 ♥' + GD.RANK_TEXT[level] + '（逢人配）来补牌。</div>';
    }

    var wildCount = S.sel.filter(function (c) { return GD.isWild(c, level); }).length;
    var shown = ints.slice(0, 8);
    var head = '<p class="hint-line" style="margin:0 0 10px">共 <b style="color:var(--gold-2)">' +
      ints.length + '</b> 种解释' + (wildCount ? '，已按"默认取最大牌型"排序' : '') +
      (ints.length > shown.length ? '（只展示前 8 种）' : '') + '。</p>';

    return head + '<div class="result-list">' + shown.map(function (c, i) {
      var w = GD.wildAssignments(c, level);
      var isBomb = GD.bombFamily(c);
      return '<div class="result-item' + (i === 0 ? ' best' : '') + '">' +
        '<div class="ri-main">' +
        '<div class="ri-name">' + GD.comboLabel(c, level) +
        (i === 0 ? '<span class="tag gold">最强</span>' : '') +
        (isBomb ? '<span class="tag bomb">炸弹家族</span>' : '<span class="tag">普通牌型</span>') +
        '</div>' +
        '<div class="ri-sub">' + (w.length
          ? '逢人配：' + w.map(function (x) { return GD.cardText(x.card) + ' → <b style="color:var(--gold-2)">' + x.as + '</b>'; }).join('、')
          : '没有用到逢人配') +
        '</div></div>' +
        '<div>' + UI.row(c.cards, level, { size: 'xs', tight: true }) + '</div>' +
        '</div>';
    }).join('') + '</div>';
  }

  function paint(el) {
    var level = S.level;
    var selHTML = S.sel.length
      ? S.sel.map(function (c, i) {
        return UI.card(c, level, { size: 'sm', clickable: true, attrs: 'data-idx="' + i + '" title="点击移出"' });
      }).join('')
      : '<div class="tray-empty">↑ 这里是你的托盘，点左边的牌加进来</div>';

    el.innerHTML =
      '<section class="panel">' +
      '<div class="sec-head"><h2>逢人配实验室</h2><p>亲手摆一摆，比看十遍规则有用</p>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-sm" data-act="demo">来个示例</button>' +
      '<button class="btn btn-sm ghost" data-act="clear">清空</button>' +
      '</div>' +
      '<div class="lab">' +
      '<div>' +
      '<p class="hint-line" style="margin:0 0 10px">点牌面加入托盘（每种牌最多两张，因为有两副牌）。' +
      '打 <b style="color:var(--gold-2)">' + GD.RANK_TEXT[level] + '</b> 时，' +
      '<b style="color:var(--gold-2)">♥' + GD.RANK_TEXT[level] + '</b> 就是逢人配。</p>' +
      deckHTML(level) +
      '</div>' +
      '<div>' +
      '<p class="hint-line" style="margin:0 0 8px">我的托盘（点击移出）</p>' +
      '<div class="tray">' + selHTML + '</div>' +
      '<div style="margin-top:16px">' + resultsHTML(level) + '</div>' +
      '</div>' +
      '</div>' +
      '</section>';
  }

  function demo() {
    S.sel = [];
    var level = S.level;
    var suits = ['C', 'C', 'C', 'C'];
    [7, 8, 10, 11].forEach(function (r, i) {
      S.sel.push(GD.makeCard(suits[i], r, 0));
    });
    S.sel.push(GD.makeCard('H', level, 0));
  }

  root.ViewLab = {
    mount: function (el) {
      el.addEventListener('click', function (ev) {
        var suitBtn = ev.target.closest('[data-suit]');
        if (suitBtn) {
          add(suitBtn.getAttribute('data-suit'), parseInt(suitBtn.getAttribute('data-rank'), 10));
          paint(el);
          return;
        }
        var trayCard = ev.target.closest('[data-idx]');
        if (trayCard) {
          removeAt(parseInt(trayCard.getAttribute('data-idx'), 10));
          paint(el);
          return;
        }
        var act = ev.target.closest('[data-act]');
        if (act) {
          var a = act.getAttribute('data-act');
          if (a === 'clear') { S.sel = []; paint(el); }
          if (a === 'demo') { demo(); paint(el); }
        }
      });
    },
    render: function (el, level) {
      S.level = level;
      paint(el);
    }
  };
})(window);

/* 视图 04 · 拆牌教练 */
(function (root) {
  'use strict';
  var GD = root.GD, UI = root.UI;

  var S = { level: 2, hand: null, decomp: null };

  function catOf(type) {
    if (type === 'bomb' || type === 'flush' || type === 'jokerbomb') return ['cat-bomb', '炸弹'];
    if (type === 'plate' || type === 'tube' || type === 'straight') return ['cat-seq', '整手大牌'];
    if (type === 'fullhouse' || type === 'triple') return ['cat-mid', '中等牌'];
    return ['cat-low', '零散牌'];
  }

  function deal(level) {
    var deck = GD.shuffle(GD.createDeck(), Math.random);
    S.hand = deck.slice(0, 27);
    S.decomp = GD.decomposeHand(S.hand, level, 80);
  }

  function coachNotes(d, level) {
    var notes = [];
    var jokers = S.hand.filter(function (c) { return GD.isJoker(c); }).length;
    var bigJokers = S.hand.filter(function (c) { return c.s === 'X' && c.r === 16; }).length;

    if (d.count <= 7) {
      notes.push(['✓', '只有 <b>' + d.count + ' 手</b>，牌型很整。这种牌要主动抢牌权，别缩在后面等队友。']);
    } else if (d.count >= 10) {
      notes.push(['!', '要拆成 <b>' + d.count + ' 手</b>，偏多。出牌顺序比牌力更重要：先放顺子、钢板这种"一张牌管好几张"的，单张留到最后再说。']);
    } else {
      notes.push(['·', '拆成 <b>' + d.count + ' 手</b>，属于正常水平。思路：先把零散对子和单张处理掉，把整手牌流到最后。']);
    }

    if (d.bombs) {
      notes.push(['炸', '手里有 <b>' + d.bombs + ' 个炸弹</b>。炸弹是翻盘资本，前期别拿去炸小牌，尽量留给对手的顺子、钢板或者冲刺阶段。']);
    }

    if (d.singles >= 5) {
      notes.push(['↓', '单张有 <b>' + d.singles + ' 张</b>，偏多。出一张单张就等于把牌权送人一次，能并进对子/顺子就别留。']);
    }

    if (d.wilds) {
      notes.push(['配', '有 <b>' + d.wilds + ' 张逢人配（♥' + GD.RANK_TEXT[level] + '）</b>。它最强的地方是<b>补成炸弹</b>或者<b>补齐关键顺子</b>，千万不要顺手当单张打掉。']);
    }

    if (jokers) {
      notes.push(['王', '有 <b>' + jokers + ' 张王牌</b>。小王、大王是控牌权的最强手段，可以留一张在最后收尾；' +
        (bigJokers >= 2 ? '两张大王还能在下一局开局时<b>抗贡</b>。' : '单张大王也是很好的单张终结者。')]);
    }

    notes.push(['→', '领出时优先打<b>最小的、最不灵活的那手牌</b>，把大牌和炸弹留在手上当"保险"。']);
    return notes;
  }

  function paint(el) {
    var level = S.level;
    var d = S.decomp;
    var hand = GD.sortHand(S.hand, level);

    var groups = d.hands.map(function (h) {
      var cat = catOf(h.type);
      return '<div class="group ' + cat[0] + '">' +
        '<div class="g-label"><b>' + (h.type === 'raw' ? '未成牌型' : GD.TYPE_NAME[h.type]) + '</b>' + cat[1] + '</div>' +
        UI.row(h.cards, level, { size: 'xs', tight: true }) +
        '</div>';
    }).join('');

    var notes = coachNotes(d, level).map(function (n) {
      return '<div class="note"><span class="ic">' + n[0] + '</span><div>' + n[1] + '</div></div>';
    }).join('');

    el.innerHTML =
      '<section class="panel">' +
      '<div class="sec-head"><h2>拆牌教练</h2><p>同样的 27 张牌，拆法不同，输赢不同</p>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-sm primary" data-act="deal">发一手新牌</button>' +
      '</div>' +

      '<p class="hint-line" style="margin:0 0 8px">你的手牌（' + hand.length + ' 张，已按牌力从大到小排好；金框是逢人配）</p>' +
      '<div class="hand-zone">' + UI.row(hand, level, { size: 'sm' }) + '</div>' +

      '<div class="split-stats">' +
      '<div class="big-stat"><span class="bs-num">' + d.count + '<small>手</small></span><span class="bs-label">需要出几次</span></div>' +
      '<div class="big-stat"><span class="bs-num">' + d.singles + '<small>张</small></span><span class="bs-label">单张（最容易送牌权）</span></div>' +
      '<div class="big-stat"><span class="bs-num">' + d.bombs + '<small>个</small></span><span class="bs-label">炸弹</span></div>' +
      '<div class="big-stat"><span class="bs-num">' + d.wilds + '<small>张</small></span><span class="bs-label">逢人配</span></div>' +
      '</div>' +

      '<div class="divider"></div>' +
      '<div class="sec-head"><h2 style="font-size:14.5px">参考拆法</h2><p>一种合理的分法，不是唯一答案</p></div>' +
      '<div class="group-grid">' + groups + '</div>' +

      '<div class="divider"></div>' +
      '<div class="sec-head"><h2 style="font-size:14.5px">教练点评</h2><p>为什么这样拆</p></div>' +
      '<div class="coach-notes">' + notes + '</div>' +
      '</section>';
  }

  root.ViewSplit = {
    mount: function (el) {
      el.addEventListener('click', function (ev) {
        var act = ev.target.closest('[data-act]');
        if (act && act.getAttribute('data-act') === 'deal') {
          deal(S.level);
          paint(el);
        }
      });
    },
    render: function (el, level) {
      var changed = S.level !== level;
      S.level = level;
      if (!S.hand) deal(level);
      else if (changed) S.decomp = GD.decomposeHand(S.hand, level, 80);
      paint(el);
    }
  };
})(window);


/* ======== js/view-play.js ======== */
/* 视图 05 · 实战对局（你 vs 队友 vs 两个 AI 对手） */
(function (root) {
  'use strict';
  var GD = root.GD, UI = root.UI, G = root.GDGame;

  var NAMES = ['你', '下家', '队友', '上家'];
  var DIFF_NAME = ['新手', '普通', '高手'];

  var S = {
    match: null,
    difficulty: 1,
    coach: true,
    showMemory: true,
    selected: [],
    hint: null,
    hintToken: null,
    error: null,
    timer: null,
    gen: 0,
    el: null
  };

  function name(i) { return NAMES[i]; }
  function isMine(i) { return i === 0 || i === 2; }

  /* ------------------------------------------------------------ 状态查询 */

  function myTurn() {
    var d = S.match && S.match.deal;
    return !!(d && d.phase === 'play' && d.turn === 0);
  }

  function selCombo() {
    var d = S.match.deal;
    if (!S.selected.length) return null;
    return GD.identify(S.selected, d.level);
  }

  function hintToken() {
    var d = S.match.deal;
    return d.events.length + ':' + d.turn + ':' + d.trick.combo;
  }

  function ensureHint() {
    if (!S.coach || !myTurn()) { S.hint = null; return; }
    var tok = hintToken();
    if (S.hint && S.hintToken === tok) return;
    var t0 = Date.now();
    S.hint = G.hint(S.match, 0);
    S.hintToken = tok;
    if (S.hint) S.hint.ms = Date.now() - t0;
  }

  /* ---------------------------------------------------------------- 渲染 */

  function headerHTML() {
    var m = S.match, d = m.deal;
    return '<div class="play-head">' +
      '<div class="ph-item"><span>本副打</span><b class="ph-level">' + GD.RANK_TEXT[d.level] + '</b></div>' +
      '<div class="ph-item mine"><span>我方</span><b>' + GD.RANK_TEXT[m.levels[0]] + '</b></div>' +
      '<div class="ph-item them"><span>对方</span><b>' + GD.RANK_TEXT[m.levels[1]] + '</b></div>' +
      '<div class="ph-item"><span>第</span><b>' + (m.dealNo + 1) + '</b><span>副</span></div>' +
      '<div class="spacer"></div>' +
      '<div class="mode-switch" aria-label="对手难度">' +
      [0, 1, 2].map(function (i) {
        return '<button data-diff="' + i + '" aria-pressed="' + (S.difficulty === i) + '" class="' + (S.difficulty === i ? 'is-active' : '') + '">' + DIFF_NAME[i] + '</button>';
      }).join('') +
      '</div>' +
      '<label class="coach-toggle"><input type="checkbox" data-act="coach"' + (S.coach ? ' checked' : '') + '><span>教练</span></label>' +
      '<button class="btn btn-sm ghost" data-act="memory" aria-pressed="' + (S.showMemory ? 'true' : 'false') + '">' + (S.showMemory ? '记牌 ✓' : '记牌') + '</button>' +
      '<button class="btn btn-sm ghost" data-act="restart">重开</button>' +
      '<div class="play-order"><span>逆时针出牌</span><b>你 → 下家 → 队友 → 上家</b><span>·</span><span>你与对家同队</span></div>' +
      '</div>';
  }

  function seatHTML(i) {
    var d = S.match.deal;
    var cls = 'seat seat-' + ['s', 'e', 'n', 'w'][i];
    if (d.turn === i && d.phase === 'play') cls += ' is-active';
    if (G.isFinished(d, i)) cls += ' is-out';
    if (isMine(i)) cls += ' is-mine';

    var sub = G.isFinished(d, i)
      ? '第 ' + (d.finished.indexOf(i) + 1) + ' 游'
      : '余 ' + d.hands[i].length + ' 张';

    var t = d.table[i];
    var playHTML = '';
    if (t === 'pass') playHTML = '<span class="seat-pass">过</span>';
    else if (t && t.cards) playHTML = UI.row(t.cards, d.level, { size: 'xs', tight: true });

    return '<div class="' + cls + '" aria-label="' + name(i) + '，' + sub + '">' +
      '<div class="seat-top">' +
      '<span class="seat-name">' + name(i) + (isMine(i) ? '<i class="seat-tag">我方</i>' : '') + '</span>' +
      '<span class="seat-sub">' + sub + '</span>' +
      '</div>' +
      '<div class="seat-play">' + playHTML + '</div>' +
      '</div>';
  }

  function centerHTML() {
    var d = S.match.deal;
    var c = d.trick.combo;
    if (!c) {
      return '<div class="table-center is-empty">' +
        '<div class="tc-label">' + (d.turn === 0 ? '轮到你领出' : '等 ' + name(d.turn) + ' 领出') + '</div>' +
        '<div class="tc-empty">这一圈还没人出牌</div>' +
        '</div>';
    }
    return '<div class="table-center">' +
      '<div class="tc-label">当前最大</div>' +
      UI.row(c.cards, d.level, { size: 'sm' }) +
      '<div class="tc-sub">' + GD.comboLabel(c, d.level) + ' · ' + name(d.trick.owner) + ' 出</div>' +
      '</div>';
  }

  function handHTML() {
    var d = S.match.deal;
    var hand = GD.sortHand(d.hands[0], d.level);
    var picked = {};
    S.selected.forEach(function (c) { picked[GD.cardKey(c)] = 1; });
    var cards = hand.map(function (c) {
      var k = GD.cardKey(c);
      return UI.card(c, d.level, {
        size: 'sm',
        clickable: true,
        cls: picked[k] ? 'is-picked' : '',
        attrs: 'data-card="' + k + '"'
      });
    }).join('');

    var combo = selCombo();
    var selInfo;
    if (!S.selected.length) selInfo = '点击选牌，再点一次取消';
    else if (!combo) selInfo = '<span class="bad">已选 ' + S.selected.length + ' 张 · 不成牌型</span>';
    else selInfo = '<span class="good">已选 ' + S.selected.length + ' 张 · ' + GD.comboLabel(combo, d.level) + '</span>';

    var turn = myTurn();
    return '<div class="my-zone">' +
      '<div class="my-head">' +
      '<span class="my-title">你的手牌 · 剩 ' + d.hands[0].length + ' 张</span>' +
      '<span class="my-sel">' + selInfo + '</span>' +
      '</div>' +
      '<div class="my-hand">' + cards + '</div>' +
      '<div class="actions">' +
      '<button class="btn primary" data-act="play"' + (turn && S.selected.length ? '' : ' disabled') + '>出牌</button>' +
      '<button class="btn" data-act="pass"' + (turn && d.trick.combo ? '' : ' disabled') + '>过</button>' +
      '<button class="btn ghost" data-act="hint"' + (turn ? '' : ' disabled') + '>提示</button>' +
      '<button class="btn ghost" data-act="clear"' + (S.selected.length ? '' : ' disabled') + '>清空</button>' +
      '<span class="actions-tip kb-only">快捷键：Enter 出牌 · 空格 过 · H 提示</span>' +
      '</div>' +
      '</div>';
  }

  function coachHTML() {
    var d = S.match.deal;
    if (d.phase !== 'play') return '';
    if (S.error) return '<div class="coach-box is-err"><div class="coach-title">出牌不合法</div><div>' + S.error + '</div></div>';
    if (!S.coach) return '<div class="coach-box is-off"><div class="coach-title">教练已关闭</div><div class="coach-reason">自己先判断，再回来打开对照一下，进步更快。</div></div>';
    if (d.turn !== 0) {
      return '<div class="coach-box is-wait"><div class="coach-title">等待中</div><div class="coach-reason">' +
        name(d.turn) + ' 正在出牌… 轮到你时会给出建议。</div></div>';
    }
    if (!S.hint) return '';
    var h = S.hint;
    var act = h.action === 'play'
      ? '出 <b>' + (h.combo ? GD.comboLabel(h.combo, d.level) : '这手牌') + '</b>'
      : '<b>过</b>';
    return '<div class="coach-box">' +
      '<div class="coach-title">教练建议</div>' +
      '<div class="coach-act">' + act + '</div>' +
      '<div class="coach-reason">' + h.reason + '</div>' +
      (h.action === 'play' && h.cards ? '<div class="coach-cards">' + UI.row(h.cards, d.level, { size: 'xs', tight: true }) + '</div>' : '') +
      '<button class="btn btn-sm coach-apply" data-act="hint">' + (h.action === 'play' ? '帮我选这手' : '知道了') + '</button>' +
      (h.alts && h.alts.length ? '<div class="coach-alts">其他可选：' + h.alts.join(' / ') + '</div>' : '') +
      '</div>';
  }

  function logHTML() {
    var d = S.match.deal;
    var items = d.events.slice(-9).map(function (e) {
      if (e.type === 'play') return '<div class="log-line"><i>' + name(e.player) + '</i> 出 ' + GD.comboLabel(e.combo, d.level) + '</div>';
      if (e.type === 'pass') return '<div class="log-line is-pass"><i>' + name(e.player) + '</i> 过</div>';
      return '<div class="log-line is-sys">' + (e.text || '') + '</div>';
    }).join('');
    return '<div class="log-box"><div class="log-title">本圈记录</div><div class="log-lines">' + (items || '<div class="log-line is-pass">—</div>') + '</div></div>';
  }

  /* 记牌器：你自己的牌 + 场上已出的牌 → 推出"外面还剩什么" */
  function memoryHTML() {
    if (!S.showMemory) return '';
    var d = S.match.deal;
    var mem = G.memoryOf(S.match, 0);

    var chips = mem.list.map(function (it) {
      var cls = 'mem-chip';
      if (it.count === 0) cls += ' is-zero';
      if (it.kind === 'wild') cls += ' is-wild';
      if (it.isLevel) cls += ' is-level';
      if (it.kind === 'rank' && it.pBomb > 0.45) cls += ' is-bomb';
      return '<span class="' + cls + '">' + it.label + '<b>' + it.count + '</b></span>';
    }).join('');

    var bombText;
    if (mem.bombExpect < 0.25) bombText = '外面基本不会有炸弹了';
    else {
      var top = mem.topBombRanks.map(function (r) { return GD.RANK_TEXT[r]; }).join('、');
      bombText = '外面估计还有约 <b>' + Math.max(1, Math.round(mem.bombExpect)) + '</b> 个炸弹' +
        (top ? '（' + top + ' 概率较高）' : '') +
        '<span class="mem-note">（按未知牌均匀分布近似估计）</span>';
    }

    return '<div class="mem-strip">' +
      '<div class="mem-head">' +
      '<span class="mem-title">记牌</span>' +
      '<span class="mem-sub">外面还剩 <b>' + mem.unknownCount + '</b> 张（对手 ' + mem.oppHands + ' · 队友 ' + mem.partnerHand + '） · ' + bombText + '</span>' +
      '</div>' +
      '<div class="mem-chips">' + chips + '</div>' +
      '</div>';
  }

  function resultHTML() {
    var m = S.match, d = m.deal, r = d.result;
    var order = r.finished.map(function (p, i) {
      return '<div class="rank-row' + (isMine(p) ? ' is-mine' : '') + '">' +
        '<span class="rank-no">' + (i + 1) + '</span>' +
        '<span class="rank-name">' + name(p) + '</span>' +
        '<span class="rank-tag">' + (['头游', '二游', '三游', '末游'][i]) + '</span>' +
        '</div>';
    }).join('');

    var upgrade;
    if (r.passedA) upgrade = '<b class="gold">过 A！</b> 你们从 A 级成功通关。';
    else {
      var posText = r.partnerPos === 2 ? '队友拿到二游（双上）' : r.partnerPos === 3 ? '队友拿到三游' : '队友是末游';
      upgrade = '头游 + ' + posText + '，升 <b class="gold">' + r.inc + '</b> 级：' +
        GD.RANK_TEXT[r.levelsBefore[r.winnerTeam]] + ' → ' + GD.RANK_TEXT[r.levelsAfter[r.winnerTeam]] +
        (r.atA && !r.passedA ? '（打 A 必须头游 + 队友二游/三游才算过 A，这局没过，继续打 A）' : '');
    }

    var mineWin = r.winnerTeam === 0;
    var head = m.over
      ? (m.winnerTeam === 0
        ? '<div class="result-title win">🎉 你们打到 A 并过关，赢了这一局！</div>'
        : m.winnerTeam === 1
          ? '<div class="result-title lose">😮 对方先过 A，这一局输了。</div>'
          : '<div class="result-title">副数打完，按级数结算。我方 ' + GD.RANK_TEXT[m.levels[0]] + ' / 对方 ' + GD.RANK_TEXT[m.levels[1]] + '</div>')
      : '<div class="result-title ' + (mineWin ? 'win' : 'lose') + '">' + (mineWin ? '这一副你们赢了' : '这一副对方赢了') + '</div>';

    return '<div class="result-card">' +
      head +
      '<div class="rank-list">' + order + '</div>' +
      '<div class="result-line">' + upgrade + '</div>' +
      '<div class="result-actions">' +
      (m.over
        ? '<button class="btn primary" data-act="restart">再来一局</button>'
        : '<button class="btn primary" data-act="next-deal">下一副 →</button>' +
          '<span class="hint-line">下一副开始前会自动处理进贡/还贡</span>') +
      '</div>' +
      '</div>';
  }

  function paint() {
    var el = S.el;
    if (!el || !S.match) return;
    var m = S.match, d = m.deal;

    if (d.phase === 'play') ensureHint();

    var body;
    if (d.phase === 'over') {
      body = '<div class="table">' + seatHTML(2) + seatHTML(3) + seatHTML(1) + seatHTML(0) + centerHTML() + '</div>' + resultHTML();
    } else {
      body = '<div class="table">' +
        seatHTML(2) + seatHTML(3) + seatHTML(1) + seatHTML(0) + centerHTML() +
        '</div>' +
        handHTML() +
        memoryHTML() +
        '<div class="coach-row">' + coachHTML() + logHTML() + '</div>';
    }

    el.innerHTML = '<section class="panel play-panel">' + headerHTML() + body + '</section>';
  }

  /* ------------------------------------------------------------ AI 自动走 */

  function scheduleAI() {
    clearTimeout(S.timer);
    S.timer = null;
    var m = S.match;
    if (!m || m.over) return;
    var d = m.deal;
    if (!d || d.phase !== 'play' || d.turn === 0) return;

    var gen = ++S.gen;
    var seat = d.turn;
    S.timer = setTimeout(function () {
      if (S.gen !== gen) return;
      var mm = S.match;
      if (!mm || mm !== m) return;
      var dd = mm.deal;
      if (dd.phase !== 'play' || dd.turn !== seat) return;

      var mv = G.aiTurn(mm, seat, S.difficulty);
      var res = mv.action === 'play' ? G.play(mm, seat, mv.cards) : G.pass(mm, seat);
      if (!res.ok) {
        /* 兜底：AI 万一给出非法动作，退化为过牌，避免卡死 */
        G.pass(mm, seat);
      }

      S.hint = null;
      paint();
      if (mm.deal.phase === 'play' && mm.deal.turn !== 0) scheduleAI();
    }, 460 + Math.random() * 420);
  }

  /* ---------------------------------------------------------------- 操作 */

  function newMatch() {
    S.match = G.startMatch({ maxDeals: 20 });
    G.newDeal(S.match);
    S.selected = [];
    S.hint = null;
    S.hintToken = null;
    S.error = null;
    paint();
    scheduleAI();
  }

  function toggleCard(key) {
    var d = S.match.deal;
    if (d.phase !== 'play' || d.turn !== 0) return;
    var card = null;
    for (var i = 0; i < d.hands[0].length; i++) {
      if (GD.cardKey(d.hands[0][i]) === key) { card = d.hands[0][i]; break; }
    }
    if (!card) return;
    var at = S.selected.indexOf(card);
    if (at >= 0) S.selected.splice(at, 1);
    else S.selected.push(card);
    S.error = null;
    paint();
  }

  function doPlay() {
    if (!myTurn() || !S.selected.length) return;
    var r = G.play(S.match, 0, S.selected.slice());
    if (!r.ok) { S.error = r.err; paint(); return; }
    S.selected = [];
    S.hint = null;
    S.error = null;
    paint();
    scheduleAI();
  }

  function doPass() {
    if (!myTurn()) return;
    if (!S.match.deal.trick.combo) { S.error = '你是这一圈的领出方，必须出牌'; paint(); return; }
    var r = G.pass(S.match, 0);
    if (!r.ok) { S.error = r.err; paint(); return; }
    S.selected = [];
    S.hint = null;
    S.error = null;
    paint();
    scheduleAI();
  }

  function doHint() {
    if (!myTurn()) return;
    S.error = null;
    S.coach = true;
    var h = G.hint(S.match, 0);
    S.hint = h;
    S.hintToken = hintToken();
    if (h && h.action === 'play' && h.cards) S.selected = h.cards.slice();
    paint();
  }

  function showHintIfCoach() {
    if (!S.coach || !myTurn()) return;
    ensureHint();
  }

  /* ---------------------------------------------------------------- 挂载 */

  root.ViewPlay = {
    mount: function (el) {
      S.el = el;

      el.addEventListener('click', function (ev) {
        var cardEl = ev.target.closest('[data-card]');
        if (cardEl) { toggleCard(cardEl.getAttribute('data-card')); return; }

        var diffBtn = ev.target.closest('[data-diff]');
        if (diffBtn) {
          S.difficulty = parseInt(diffBtn.getAttribute('data-diff'), 10);
          paint();
          return;
        }

        var act = ev.target.closest('[data-act]');
        if (!act) return;
        var a = act.getAttribute('data-act');
        if (a === 'play') doPlay();
        else if (a === 'pass') doPass();
        else if (a === 'hint') doHint();
        else if (a === 'clear') { S.selected = []; S.error = null; paint(); }
        else if (a === 'memory') { S.showMemory = !S.showMemory; paint(); }
        else if (a === 'restart') newMatch();
        else if (a === 'next-deal') {
          G.newDeal(S.match);
          S.selected = []; S.hint = null; S.error = null;
          paint();
          scheduleAI();
        }
      });

      el.addEventListener('change', function (ev) {
        if (ev.target.matches('[data-act="coach"]')) {
          S.coach = ev.target.checked;
          S.hint = null;
          paint();
        }
      });

      el.addEventListener('keydown', function (ev) {
        var cardEl = ev.target.closest('[data-card]');
        if (!cardEl || (ev.key !== 'Enter' && ev.key !== ' ')) return;
        ev.preventDefault();
        ev.stopPropagation();
        toggleCard(cardEl.getAttribute('data-card'));
      });

      /* 快捷键挂在 document 上，只在"实战对局"页生效 */
      document.addEventListener('keydown', function (ev) {
        if (!S.match) return;
        var view = document.getElementById('view-play');
        if (!view || !view.classList.contains('is-active')) return;
        var tag = ev.target && ev.target.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
        if (ev.key === 'Enter') {
          ev.preventDefault();
          var btnPlay = document.getElementById('btn-play');
          if (btnPlay && !btnPlay.disabled) doPlay();
        }
        else if (ev.key === ' ') {
          ev.preventDefault();
          var btnPass = document.getElementById('btn-pass');
          if (btnPass && !btnPass.disabled) doPass();
        }
        else if (ev.key.toLowerCase() === 'h') { ev.preventDefault(); doHint(); }
      });
    },

    render: function (el, level) {
      S.el = el;
      if (!S.match) { newMatch(); return; }
      paint();
      scheduleAI();
    },

    /* 仅用于自动化测试 */
    __test: { state: S, paint: paint, newMatch: newMatch, scheduleAI: scheduleAI }
  };
})(window);


/* ======== js/app.js ======== */
/* 应用入口：视图切换 + 级牌管理 */
(function (root, doc) {
  'use strict';
  var GD = root.GD, UI = root.UI;

  var VIEWS = {
    rules: root.ViewRules,
    quiz: root.ViewQuiz,
    lab: root.ViewLab,
    split: root.ViewSplit,
    play: root.ViewPlay
  };

  var App = {
    level: 2,
    view: 'rules',
    mounted: {},

    init: function () {
      var saved = 0;
      try { saved = parseInt(root.localStorage.getItem('gd-level'), 10); } catch (e) { saved = 0; }
      if (saved >= 2 && saved <= 14) this.level = saved;

      this.buildLevelPicker();

      var self = this;
      doc.getElementById('tabs').addEventListener('click', function (ev) {
        var btn = ev.target.closest('.tab');
        if (btn) self.setView(btn.getAttribute('data-view'));
      });

      this.setView('play');
    },

    buildLevelPicker: function () {
      var self = this;
      var box = doc.getElementById('levelOptions');
      var html = '';
      for (var r = 2; r <= 14; r++) {
        html += '<button data-level="' + r + '"' + (r === this.level ? ' class="is-active"' : '') + '>' +
          GD.RANK_TEXT[r] + '</button>';
      }
      box.innerHTML = html;
      box.addEventListener('click', function (ev) {
        var btn = ev.target.closest('button[data-level]');
        if (btn) self.setLevel(parseInt(btn.getAttribute('data-level'), 10));
      });
    },

    setLevel: function (level) {
      if (level === this.level) return;
      this.level = level;
      try { root.localStorage.setItem('gd-level', String(level)); } catch (e) { }
      UI.$('#levelOptions button').forEach(function (b) {
        b.classList.toggle('is-active', parseInt(b.getAttribute('data-level'), 10) === level);
      });
      var v = VIEWS[this.view];
      if (v) v.render(doc.getElementById('view-' + this.view), level);
    },

    setView: function (name) {
      if (!VIEWS[name]) return;
      this.view = name;
      UI.$('.tab').forEach(function (b) {
        b.classList.toggle('is-active', b.getAttribute('data-view') === name);
      });
      UI.$('.view').forEach(function (sec) {
        sec.classList.toggle('is-active', sec.id === 'view-' + name);
      });
      var el = doc.getElementById('view-' + name);
      var v = VIEWS[name];
      if (!this.mounted[name]) {
        if (v.mount) v.mount(el);
        this.mounted[name] = true;
      }
      doc.body.classList.toggle('in-match', name === 'play');
      v.render(el, this.level);
      root.scrollTo(0, 0);
    }
  };

  root.App = App;
  App.init();
})(window, document);


</script>
